[build]
  command   = "pip install -r requirements.txt"
  functions = "netlify/functions"
  publish   = "web/static"

[build.environment]
  PYTHON_VERSION          = "3.11"
  PIP_NO_CACHE_DIR        = "1"
  SECRETS_SCAN_ENABLED    = "false"

[functions]
  included_files = ["web/**", "services/**", "auth/**", "core/**", "app.py"]

# Tell Netlify this is a Python function (required — bundler defaults to JS)
[functions."api"]
  runtime = "python3.8"

# All routes → FastAPI function (Mangum reads path from Lambda event)
[[redirects]]
  from   = "/*"
  to     = "/.netlify/functions/api"
  status = 200
  force  = true

[dev]
  command    = "uvicorn app:app --host 0.0.0.0 --port 8085"
  targetPort = 8085
  port       = 8888
