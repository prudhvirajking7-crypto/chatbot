{% extends "base.html" %}
{% block title %}Admin Login | Agentic RAG{% endblock %}
{% block content %}
<div class="admin-login-wrap">
  <div class="admin-login-card">
    {% if flash %}
    <div class="flash flash-{{ flash.level }}" style="margin-bottom:20px">{{ flash.message }}</div>
    {% endif %}

    <div class="auth-logo" style="margin-bottom:28px">
      <div class="auth-logo-icon">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M9 2L16 6V12L9 16L2 12V6L9 2Z" stroke="white" stroke-width="1.5" stroke-linejoin="round"/><circle cx="9" cy="9" r="2" fill="white"/></svg>
      </div>
      <div>
        <span style="font-size:16px;font-weight:700">Agentic RAG</span>
        <span class="sidebar-logo-sub">Admin Console</span>
      </div>
    </div>

    <h2 class="auth-heading">Admin Login</h2>
    <p class="auth-subheading" style="margin-bottom:24px">Enter your admin credentials</p>

    <form action="/admin/login" method="post" class="auth-form">
      <div class="form-group">
        <label class="form-label" for="username">Username</label>
        <input class="form-input" id="username" name="username" type="text" placeholder="Admin username" required>
      </div>
      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <input class="form-input" id="password" name="password" type="password" placeholder="Admin password" required>
      </div>
      <button class="btn btn-primary btn-full" type="submit">Login as Admin</button>
    </form>

    <p class="auth-footer" style="margin-top:16px">
      <a href="/">← Back to user login</a>
    </p>
  </div>
</div>
{% endblock %}
